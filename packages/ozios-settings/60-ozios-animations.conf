# KWin turns every animation off when it draws in software: a virtual machine
# without 3D acceleration, or a computer whose graphics driver is not working.
# The desktop then feels dead. OziOS keeps them; its light profile (shorter
# animations, no blur, no wobble, a still wallpaper) is cheap enough there.
# With a real graphics card this changes nothing. `ozi effects off` still
# turns them off.
KWIN_EFFECTS_FORCE_ANIMATIONS=1
