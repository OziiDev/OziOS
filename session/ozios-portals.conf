# Portals in the OziOS session (XDG_CURRENT_DESKTOP=OziOS:KDE). KDE's file
# dialogs and settings; notifications through org.freedesktop.Notifications,
# which ozi-shell serves.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.Settings=kde;gtk
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=gtk
